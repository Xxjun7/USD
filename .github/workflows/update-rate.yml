name: Update USD Exchange Rate

on:
  workflow_dispatch:

  schedule:
    # 每 5 分鐘執行一次
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-rate:

    runs-on: ubuntu-latest

    steps:

      # =========================
      # 取得 GitHub Repository
      # =========================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 使用 corsproxy 取得臺灣銀行
      # =========================

      - name: Get USD exchange rate
        run: |

          python3 <<'PY'

          import urllib.request
          import urllib.parse
          import re
          import html
          import sys


          # 臺灣銀行網址
          target_url = "https://rate.bot.com.tw/xrt?Lang=zh-TW"


          # CORS Proxy
          proxy_url = (
              "https://corsproxy.io/"
              "?key=webdemo1"
              "&url=" +
              urllib.parse.quote(
                  target_url,
                  safe=""
              )
          )


          print("Proxy URL:")
          print(proxy_url)


          # =========================
          # 發送請求
          # =========================

          request = urllib.request.Request(
              proxy_url,
              headers={
                  "User-Agent":
                  "Mozilla/5.0"
              }
          )


          try:

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              data = response.read()

              print(
                  "HTTP:",
                  response.status
              )

              print(
                  "資料大小:",
                  len(data)
              )

          except Exception as e:

              print("Proxy 取得資料失敗:")

              print(e)

              sys.exit(1)


          # =========================
          # 解碼 HTML
          # =========================

          try:

              page = data.decode("utf-8")

          except:

              page = data.decode(
                  "big5",
                  errors="ignore"
              )


          page = html.unescape(page)


          # =========================
          # 找所有 TR
          # =========================

          rows = re.findall(
              r"<tr\b[^>]*>[\s\S]*?</tr>",
              page,
              re.IGNORECASE
          )


          print(
              "找到 TR 數量:",
              len(rows)
          )


          # =========================
          # 找 USD
          # =========================

          usd_row = None


          for row in rows:

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  row
              )

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


              if (
                  "美金" in text
                  and "USD" in text
              ):

                  usd_row = row

                  print(
                      "找到美金 USD 資料列"
                  )

                  break


          if usd_row is None:

              print(
                  "找不到美金 USD"
              )

              print(
                  page[:3000]
              )

              sys.exit(1)


          # =========================
          # 找「本行即期賣出」
          # =========================

          pattern = (
              r'<td[^>]*'
              r'data-table=["\']本行即期賣出["\']'
              r'[^>]*>'
              r'\s*([\d,.]+)'
              r'\s*</td>'
          )


          match = re.search(
              pattern,
              usd_row,
              re.IGNORECASE
          )


          if match is None:

              print(
                  "找不到本行即期賣出"
              )

              print(
                  usd_row
              )

              sys.exit(1)


          # =========================
          # 取得匯率
          # =========================

          rate = match.group(1)

          rate = rate.replace(
              ",",
              ""
          )


          print(
              "USD 本行即期賣出:",
              rate
          )


          # 確認數字
          try:

              float(rate)

          except:

              print(
                  "匯率不是有效數字:",
                  rate
              )

              sys.exit(1)


          # =========================
          # 寫入 rate.txt
          # =========================

          with open(
              "rate.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  rate + "\n"
              )


          print(
              "rate.txt 更新完成"
          )

          PY


      # =========================
      # Commit
      # =========================

      - name: Commit rate.txt
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rate.txt

          if git diff --cached --quiet; then

            echo "匯率沒有變化"

          else

            git commit \
              -m "Update USD exchange rate"

            git push

          fi
