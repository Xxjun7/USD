name: Test USD Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Test Proxy
        run: |

          python3 <<'PY'

          import urllib.request
          import sys

          url = "https://corsproxy.io/?key=webdemo1&url=https%3A%2F%2Frate.bot.com.tw%2Fxrt%3FLang%3Dzh-TW"

          print("================================")
          print("測試 Proxy")
          print("================================")
          print(url)
          print("")


          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0",
                  "Accept": "text/html,application/xhtml+xml"
              }
          )


          try:

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              data = response.read()

              print("HTTP Status:")
              print(response.status)

              print("")

              print("資料大小:")
              print(len(data))

              print("")

              print("Content-Type:")
              print(response.headers.get("Content-Type"))

              print("")

              print("前 2000 個字元:")
              print(
                  data[:2000].decode(
                      "utf-8",
                      errors="replace"
                  )
              )

          except Exception as e:

              print("")
              print("❌ Proxy 連線失敗")
              print("")
              print(type(e).__name__)
              print(e)

              sys.exit(1)

          PY
