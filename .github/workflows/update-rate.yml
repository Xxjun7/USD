name: Update USD Exchange Rate

on:
  schedule:
    # 每 5 分鐘執行一次
    - cron: "*/5 * * * *"

  # 允許手動執行
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-rate:

    runs-on: ubuntu-latest

    steps:

      # 取得 Repository
      - name: Checkout
        uses: actions/checkout@v4

      # 抓取臺灣銀行匯率
      - name: Get USD rate
        run: |

          python3 <<'PY'

          import urllib.request
          import re
          import sys

          url = "https://rate.bot.com.tw/xrt?Lang=zh-TW"

          try:

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "Mozilla/5.0"
                  }
              )

              response = urllib.request.urlopen(
                  request,
                  timeout=30
              )

              html = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          except Exception as e:

              print("無法取得臺灣銀行資料")
              print(e)

              sys.exit(1)


          # 找到美金 USD 那一列
          row_match = re.search(
              r"<tr[\s\S]*?美金\s*\(USD\)[\s\S]*?</tr>",
              html,
              re.IGNORECASE
          )

          if not row_match:

              print("找不到美金 USD")

              sys.exit(1)


          row = row_match.group(0)


          # 找「本行即期賣出」
          rate_match = re.search(
              r'data-table=["\']本行即期賣出["\'][^>]*>\s*([\d.]+)\s*</td>',
              row,
              re.IGNORECASE
          )


          if not rate_match:

              print("找不到本行即期賣出")

              sys.exit(1)


          rate = rate_match.group(1)


          print("USD 本行即期賣出：", rate)


          # 寫入 rate.txt
          with open(
              "rate.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(rate + "\n")

          PY


      # Commit 更新後的 rate.txt
      - name: Commit rate
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add rate.txt

          git diff --cached --quiet || \
            git commit -m "Update USD exchange rate"

          git push
