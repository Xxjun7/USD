<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>美金即期賣出</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background: #111827;
            color: white;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Noto Sans TC",
                "Microsoft JhengHei",
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            text-align: center;
            padding: 30px;
        }

        .title {
            font-size: clamp(20px, 4vw, 36px);
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .rate {
            font-size: clamp(80px, 20vw, 220px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -5px;
            color: #ffffff;

            transition:
                color 0.3s ease,
                transform 0.3s ease;
        }

        .rate.up {
            color: #ef4444;
            transform: scale(1.03);
        }

        .rate.down {
            color: #22c55e;
            transform: scale(1.03);
        }

        .unit {
            margin-top: 20px;
            font-size: clamp(18px, 3vw, 28px);
            color: #9ca3af;
        }

        .status {
            margin-top: 35px;
            font-size: 14px;
            color: #6b7280;
        }

        .status.error {
            color: #ef4444;
        }

        .refresh {
            margin-top: 8px;
            font-size: 13px;
            color: #4b5563;
        }

        /*
         * Google 試算表專用元素
         *
         * 不影響畫面顯示
         */
        #usdRateForSheet {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        美金 (USD)
    </div>

    <!-- ==============================
         畫面顯示的匯率
         ============================== -->

    <div id="rate" class="rate">
        --
    </div>

    <!-- ==============================
         Google 試算表抓取用
         
         IMPORTXML 可以指定這個 ID
         ============================== -->

    <span id="usdRateForSheet">
        --
    </span>

    <div class="unit">
        本行即期賣出
    </div>

    <div id="status" class="status">
        載入中...
    </div>

    <div id="refresh" class="refresh">
        每 5 分鐘自動更新
    </div>

</div>


<script>

    // =========================================================
    // 資料來源
    // =========================================================

    const API_URL =
        "https://corsproxy.io/?key=webdemo1&url=https%3A%2F%2Frate.bot.com.tw%2Fxrt%3FLang%3Dzh-TW";


    // =========================================================
    // 自動更新間隔
    // =========================================================

    const REFRESH_INTERVAL =
        5 * 60 * 1000;


    // =========================================================
    // DOM
    // =========================================================

    const rateElement =
        document.getElementById("rate");

    const statusElement =
        document.getElementById("status");

    const refreshElement =
        document.getElementById("refresh");

    const sheetRateElement =
        document.getElementById("usdRateForSheet");


    // =========================================================
    // 上一次匯率
    // =========================================================

    let previousRate = null;


    // =========================================================
    // 自動更新計時器
    // =========================================================

    let refreshTimer = null;


    // =========================================================
    // 取得台灣時間
    // =========================================================

    function getTaiwanTime() {

        const formatter =
            new Intl.DateTimeFormat(
                "zh-TW",
                {
                    timeZone: "Asia/Taipei",

                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",

                    hour12: false
                }
            );


        const parts =
            formatter.formatToParts(
                new Date()
            );


        const hour =
            Number(
                parts.find(
                    p => p.type === "hour"
                ).value
            );


        const minute =
            Number(
                parts.find(
                    p => p.type === "minute"
                ).value
            );


        const second =
            Number(
                parts.find(
                    p => p.type === "second"
                ).value
            );


        return {
            hour,
            minute,
            second
        };
    }


    // =========================================================
    // 判斷是否為交易時間
    //
    // 09:00 ～ 17:00
    // =========================================================

    function isTradingTime() {

        const {
            hour,
            minute
        } = getTaiwanTime();


        const totalMinutes =
            hour * 60 + minute;


        const start =
            9 * 60;


        const end =
            17 * 60;


        return (
            totalMinutes >= start &&
            totalMinutes <= end
        );
    }


    // =========================================================
    // 取得匯率
    // =========================================================

    async function fetchRate() {

        try {

            statusElement.textContent =
                "更新中...";


            statusElement.classList.remove(
                "error"
            );


            const response =
                await fetch(
                    API_URL,
                    {
                        cache: "no-store"
                    }
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );
            }


            const html =
                await response.text();


            // =================================================
            // 將 HTML 轉成 DOM
            // =================================================

            const parser =
                new DOMParser();


            const doc =
                parser.parseFromString(
                    html,
                    "text/html"
                );


            // =================================================
            // 找到「美金 (USD)」那一列
            // =================================================

            const rows =
                doc.querySelectorAll("tr");


            let usdRow = null;


            for (const row of rows) {

                const text =
                    row.textContent
                        .replace(
                            /\s+/g,
                            " "
                        )
                        .trim();


                if (
                    text.includes("美金") &&
                    text.includes("(USD)")
                ) {

                    usdRow = row;

                    break;
                }
            }


            if (!usdRow) {

                throw new Error(
                    "找不到美金 (USD) 資料"
                );
            }


            // =================================================
            // 找「本行即期賣出」
            // =================================================

            const sellElement =
                usdRow.querySelector(
                    'td[data-table="本行即期賣出"]'
                );


            if (!sellElement) {

                throw new Error(
                    "找不到本行即期賣出欄位"
                );
            }


            // =================================================
            // 取得匯率
            // =================================================

            const rateText =
                sellElement.textContent.trim();


            const rate =
                parseFloat(
                    rateText.replace(
                        /,/g,
                        ""
                    )
                );


            if (
                !Number.isFinite(rate)
            ) {

                throw new Error(
                    "取得的匯率不是有效數字"
                );
            }


            // =================================================
            // 更新匯率
            // =================================================

            updateRate(rate);


            // =================================================
            // 最後更新時間
            // =================================================

            const now =
                new Date();


            const timeText =
                now.toLocaleTimeString(
                    "zh-TW",
                    {
                        timeZone:
                            "Asia/Taipei",

                        hour12: false
                    }
                );


            statusElement.textContent =
                "最後更新：" +
                timeText;


        } catch (error) {

            console.error(
                "取得匯率失敗：",
                error
            );


            statusElement.textContent =
                "取得匯率失敗，稍後重試";


            statusElement.classList.add(
                "error"
            );
        }
    }


    // =========================================================
    // 更新匯率
    // =========================================================

    function updateRate(rate) {

        const oldRate =
            previousRate;


        // =====================================================
        // 格式化
        // =====================================================

        const formattedRate =
            rate.toFixed(3);


        // =====================================================
        // ① 更新畫面
        // =====================================================

        rateElement.textContent =
            formattedRate;


        // =====================================================
        // ② 更新 Google 試算表專用元素
        //
        // ID：
        // usdRateForSheet
        //
        // 例如：
        // 31.855
        // =====================================================

        sheetRateElement.textContent =
            formattedRate;


        // =====================================================
        // 漲跌顏色
        // =====================================================

        if (
            oldRate !== null
        ) {

            if (
                rate > oldRate
            ) {

                rateElement.classList.add(
                    "up"
                );

                rateElement.classList.remove(
                    "down"
                );


            } else if (
                rate < oldRate
            ) {

                rateElement.classList.add(
                    "down"
                );

                rateElement.classList.remove(
                    "up"
                );


            } else {

                rateElement.classList.remove(
                    "up"
                );

                rateElement.classList.remove(
                    "down"
                );
            }


            // =================================================
            // 0.5 秒後恢復白色
            // =================================================

            setTimeout(() => {

                rateElement.classList.remove(
                    "up"
                );

                rateElement.classList.remove(
                    "down"
                );

            }, 500);
        }


        previousRate =
            rate;
    }


    // =========================================================
    // 停止自動更新
    // =========================================================

    function stopAutoRefresh() {

        if (
            refreshTimer !== null
        ) {

            clearInterval(
                refreshTimer
            );


            refreshTimer = null;
        }
    }


    // =========================================================
    // 開始自動更新
    // =========================================================

    function startAutoRefresh() {

        stopAutoRefresh();


        refreshTimer =
            setInterval(
                () => {

                    if (
                        isTradingTime()
                    ) {

                        fetchRate();

                    } else {

                        stopAutoRefresh();

                        updateSchedule();
                    }

                },
                REFRESH_INTERVAL
            );
    }


    // =========================================================
    // 設定自動更新
    // =========================================================

    function updateSchedule() {

        if (
            isTradingTime()
        ) {

            startAutoRefresh();


            refreshElement.textContent =
                "每 5 分鐘自動更新";


        } else {

            stopAutoRefresh();


            refreshElement.textContent =
                "非交易時間｜重新整理網頁時更新一次";
        }
    }


    // =========================================================
    // 第一次開啟網頁
    //
    // 不論時間都立即抓一次
    // =========================================================

    fetchRate();


    // =========================================================
    // 設定自動更新
    // =========================================================

    updateSchedule();


    // =========================================================
    // 每 10 秒檢查交易時間
    //
    // 只檢查時間
    // 不抓匯率
    // =========================================================

    setInterval(
        () => {

            const trading =
                isTradingTime();


            if (
                trading &&
                refreshTimer === null
            ) {

                // 到 09:00
                // 立即抓一次

                fetchRate();

                startAutoRefresh();


            } else if (
                !trading &&
                refreshTimer !== null
            ) {

                // 到 17:01
                // 停止自動更新

                stopAutoRefresh();

                updateSchedule();
            }

        },
        10000
    );

</script>

</body>
</html>
