<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>美金即期賣出</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        min-height: 100%;
      }

      body {
        background: #111827;
        color: #ffffff;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "Noto Sans TC",
          "Microsoft JhengHei",
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 30px 16px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
      }

      /* =====================================================
       主要匯率區
       ===================================================== */
      .main-panel {
        padding:
          20px 10px 30px;
      }

      .title {
        font-size:
          clamp(20px, 4vw, 36px);
        color: #9ca3af;
        margin-bottom: 20px;
      }

      .rate {
        font-size:
          clamp(80px, 20vw, 220px);
        font-weight: 700;
        line-height: 1;
        letter-spacing: -5px;
        color: #ffffff;
        transition:
          color 0.3s ease,
          transform 0.3s ease;
      }

      .rate.up {
        color: #ef4444;
        transform:
          scale(1.03);
      }

      .rate.down {
        color: #22c55e;
        transform:
          scale(1.03);
      }

      .unit {
        margin-top: 20px;
        font-size:
          clamp(18px, 3vw, 28px);
        color: #9ca3af;
      }

      .status {
        margin-top: 35px;
        font-size: 14px;
        color: #6b7280;
      }

      .status.error {
        color: #ef4444;
      }

      .refresh {
        margin-top: 8px;
        font-size: 13px;
        color: #4b5563;
      }

      .source {
        margin-top: 18px;
        font-size: 12px;
        color: #374151;
      }

      /* =====================================================
       歷史紀錄
       ===================================================== */
      .history-panel {
        margin-top: 10px;
        background: #1f2937;
        border-radius: 16px;
        overflow: hidden;
        border:
          1px solid #374151;
        text-align: left;
      }

      .history-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding:
          16px 18px;
        border-bottom:
          1px solid #374151;
      }

      .history-title {
        font-size: 18px;
        font-weight: 600;
        color: #e5e7eb;
      }

      .history-count {
        font-size: 12px;
        color: #6b7280;
      }

      .history-table-wrapper {
        width: 100%;
        overflow-x: auto;
      }

      .history-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .history-table th {
        padding:
          12px 16px;
        background: #111827;
        color: #9ca3af;
        font-weight: 500;
        white-space: nowrap;
      }

      .history-table td {
        padding:
          12px 16px;
        border-top:
          1px solid #374151;
        color: #d1d5db;
        white-space: nowrap;
      }

      .history-table th:first-child,
      .history-table td:first-child {
        text-align: left;
      }

      .history-table th:not(:first-child),
      .history-table td:not(:first-child) {
        text-align: right;
      }

      .history-up {
        color: #ef4444 !important;
        font-weight: 600;
      }

      .history-down {
        color: #22c55e !important;
        font-weight: 600;
      }

      .history-same {
        color: #6b7280 !important;
      }

      .empty-history {
        padding: 30px 20px;
        text-align: center;
        color: #6b7280;
        font-size: 14px;
      }

      /* =====================================================
       Proxy 錯誤警示面板
       ===================================================== */
      .error-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background:
          rgba(0, 0, 0, 0.72);
        backdrop-filter:
          blur(5px);
      }

      .error-overlay.show {
        display: flex;
      }

      .error-modal {
        width: 100%;
        max-width: 460px;
        background: #1f2937;
        border:
          1px solid #7f1d1d;
        border-radius: 18px;
        padding: 30px 24px;
        text-align: center;
        box-shadow:
          0 25px 60px rgba(0, 0, 0, 0.5);
        animation:
          modalIn 0.2s ease-out;
      }

      @keyframes modalIn {
        from {
          opacity: 0;
          transform:
            scale(0.95) translateY(10px);
        }

        to {
          opacity: 1;
          transform:
            scale(1) translateY(0);
        }
      }

      .error-icon {
        width: 58px;
        height: 58px;
        margin:
          0 auto 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #450a0a;
        color: #f87171;
        font-size: 30px;
        font-weight: 700;
      }

      .error-title {
        font-size: 21px;
        font-weight: 600;
        color: #f9fafb;
        margin-bottom: 12px;
      }

      .error-message {
        font-size: 14px;
        line-height: 1.7;
        color: #9ca3af;
        margin-bottom: 20px;
      }

      .error-details {
        background: #111827;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 20px;
        color: #6b7280;
        font-size: 12px;
        line-height: 1.6;
        text-align: left;
      }

      .error-button {
        width: 100%;
        border: 0;
        border-radius: 10px;
        padding: 13px 18px;
        background: #dc2626;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .error-button:hover {
        background: #b91c1c;
      }

      .error-button:active {
        transform:
          scale(0.98);
      }

      /* =====================================================
       手機
       ===================================================== */
      @media (max-width: 600px) {
        body {
          padding:
            15px 10px;
        }

        .main-panel {
          padding:
            15px 5px 25px;
        }

        .history-table {
          font-size: 13px;
        }

        .history-table th,
        .history-table td {
          padding:
            10px 12px;
        }
      }
    </style>

  </head>
  <body>
    <div class="container">
      <!-- =====================================================
     主要匯率
     ===================================================== -->

      <main class="main-panel">

        <div class="title">
          美金 (USD)
        </div>

        <div id="rate" class="rate">
          --
        </div>

        <div class="unit">
          本行即期賣出
        </div>

        <div id="status" class="status">
          載入中...
        </div>

        <div id="refresh" class="refresh">
          判斷交易時間中...
        </div>

        <div class="source">
          資料來源：臺灣銀行
        </div>

      </main>

      <!-- =====================================================
     歷史更新訊息
     ===================================================== -->

      <section class="history-panel">

        <div class="history-header">

          <div class="history-title">
            歷史更新訊息
          </div>

          <div id="historyCount" class="history-count">
            0 筆
          </div>

        </div>

        <div class="history-table-wrapper">

          <table class="history-table">

            <thead>

              <tr>

                <th>
                  時間
                </th>

                <th>
                  匯率
                </th>

                <th>
                  變動
                </th>

              </tr>

            </thead>

            <tbody id="historyBody">
            </tbody>

          </table>

          <div id="emptyHistory" class="empty-history">
            尚無歷史更新紀錄
          </div>

        </div>

      </section>

    </div> <!-- ========================================================= Proxy / 匯率服務錯誤警示 ========================================================= -->
    <div id="errorOverlay" class="error-overlay" role="alertdialog" aria-modal="true" aria-labelledby="errorTitle">
      <div class="error-modal">

        <div class="error-icon">
          !
        </div>

        <div id="errorTitle" class="error-title">
          匯率服務暫時無法使用
        </div>

        <div id="errorMessage" class="error-message">
          目前無法取得最新匯率。
        </div>

        <div id="errorDetails" class="error-details">
          正在等待下一次連線。
        </div>

        <button id="retryButton" class="error-button" type="button">
          重新嘗試
        </button>

      </div>

    </div>
    <script>
      // =========================================================
      // 設定
      // =========================================================
      const CONFIG = {
        // 臺灣銀行 BOT
        BOT_URL: "https://rate.bot.com.tw/xrt?Lang=zh-TW",
        // 固定使用 corsproxy.io
        PROXY_URL: "https://corsproxy.io/?key=webdemo1&url=",
        // 5 分鐘
        REFRESH_INTERVAL: 5 * 60 * 1000,
        // 每 10 秒檢查交易狀態
        SCHEDULE_INTERVAL: 10 * 1000,
        // 交易時間
        TRADING_START: 9 * 60,
        TRADING_END: 17 * 60,
        // 最多保存 50 筆
        MAX_HISTORY: 50,
        // localStorage
        STORAGE_KEY: "usdRateHistory_v1",
        // 最後成功匯率
        LAST_RATE_KEY: "usdRateLastSuccess_v1"
      };
      // =========================================================
      // DOM
      // =========================================================
      const rateElement =
        document.getElementById(
          "rate"
        );
      const statusElement =
        document.getElementById(
          "status"
        );
      const refreshElement =
        document.getElementById(
          "refresh"
        );
      const historyBody =
        document.getElementById(
          "historyBody"
        );
      const historyCount =
        document.getElementById(
          "historyCount"
        );
      const emptyHistory =
        document.getElementById(
          "emptyHistory"
        );
      const errorOverlay =
        document.getElementById(
          "errorOverlay"
        );
      const errorMessage =
        document.getElementById(
          "errorMessage"
        );
      const errorDetails =
        document.getElementById(
          "errorDetails"
        );
      const retryButton =
        document.getElementById(
          "retryButton"
        );
      // =========================================================
      // 執行狀態
      // =========================================================
      let previousRate =
        null;
      let refreshTimer =
        null;
      let scheduleTimer =
        null;
      let isFetching =
        false;
      let previousTradingState =
        null;
      // =========================================================
      // Proxy URL
      // =========================================================
      function getApiUrl() {
        return (
          CONFIG.PROXY_URL +
          encodeURIComponent(
            CONFIG.BOT_URL
          )
        );
      }
      // =========================================================
      // 台灣時間
      // =========================================================
      function getTaiwanDateParts() {
        const formatter =
          new Intl.DateTimeFormat(
            "en-US", {
              timeZone: "Asia/Taipei",
              weekday: "short",
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
              hour12: false
            }
          );
        const parts =
          formatter.formatToParts(
            new Date()
          );

        function getPart(
          type
        ) {
          const part =
            parts.find(
              item =>
              item.type ===
              type
            );
          return part ?
            part.value :
            "";
        }
        return {
          weekday: getPart(
            "weekday"
          ),
          hour: Number(
            getPart(
              "hour"
            )
          ),
          minute: Number(
            getPart(
              "minute"
            )
          ),
          second: Number(
            getPart(
              "second"
            )
          )
        };
      }
      // =========================================================
      // 台灣時間 HH:mm:ss
      // =========================================================
      function getTaiwanTimeText() {
        const {
          hour,
          minute,
          second
        } =
        getTaiwanDateParts();
        return [
          String(hour).padStart(
            2,
            "0"
          ),
          String(minute).padStart(
            2,
            "0"
          ),
          String(second).padStart(
            2,
            "0"
          )
        ].join(":");
      }
      // =========================================================
      // 判斷星期一～星期五
      // =========================================================
      function isWeekday(
        weekday
      ) {
        return (
          weekday === "Mon" ||
          weekday === "Tue" ||
          weekday === "Wed" ||
          weekday === "Thu" ||
          weekday === "Fri"
        );
      }
      // =========================================================
      // 判斷交易時間
      //
      // 09:00 <= 時間 < 17:00
      // 星期一～星期五
      // =========================================================
      function isTradingTime() {
        const {
          weekday,
          hour,
          minute
        } =
        getTaiwanDateParts();
        if (
          !isWeekday(
            weekday
          )
        ) {
          return false;
        }
        const totalMinutes =
          hour * 60 +
          minute;
        return (
          totalMinutes >=
          CONFIG.TRADING_START &&
          totalMinutes <
          CONFIG.TRADING_END
        );
      }
      // =========================================================
      // 排程文字
      // =========================================================
      function getScheduleText() {
        const {
          weekday,
          hour,
          minute
        } =
        getTaiwanDateParts();
        const totalMinutes =
          hour * 60 +
          minute;
        if (
          isWeekday(
            weekday
          ) &&
          totalMinutes >=
          CONFIG.TRADING_START &&
          totalMinutes <
          CONFIG.TRADING_END
        ) {
          return (
            "交易時間｜每 5 分鐘自動更新"
          );
        }
        if (
          isWeekday(
            weekday
          )
        ) {
          return (
            "非交易時間｜重新整理網頁時更新一次"
          );
        }
        return (
          "週末｜重新整理網頁時更新一次"
        );
      }
      // =========================================================
      // localStorage：讀取歷史
      // =========================================================
      function loadHistory() {
        try {
          const saved =
            localStorage.getItem(
              CONFIG.STORAGE_KEY
            );
          if (
            !saved
          ) {
            return [];
          }
          const history =
            JSON.parse(
              saved
            );
          if (
            !Array.isArray(
              history
            )
          ) {
            return [];
          }
          return history
            .slice(
              0,
              CONFIG.MAX_HISTORY
            );
        } catch (
          error
        ) {
          console.warn(
            "讀取歷史紀錄失敗：",
            error
          );
          return [];
        }
      }
      // =========================================================
      // localStorage：保存歷史
      // =========================================================
      function saveHistory(
        history
      ) {
        try {
          localStorage.setItem(
            CONFIG.STORAGE_KEY,
            JSON.stringify(
              history.slice(
                0,
                CONFIG.MAX_HISTORY
              )
            )
          );
        } catch (
          error
        ) {
          console.warn(
            "保存歷史紀錄失敗：",
            error
          );
        }
      }
      // =========================================================
      // localStorage：最後成功匯率
      // =========================================================
      function loadLastSuccessfulRate() {
        try {
          const value =
            localStorage.getItem(
              CONFIG.LAST_RATE_KEY
            );
          if (
            value === null
          ) {
            return null;
          }
          const rate =
            Number(
              value
            );
          return Number.isFinite(
              rate
            ) ?
            rate :
            null;
        } catch (
          error
        ) {
          return null;
        }
      }
      // =========================================================
      // localStorage：保存最後成功匯率
      // =========================================================
      function saveLastSuccessfulRate(
        rate
      ) {
        try {
          localStorage.setItem(
            CONFIG.LAST_RATE_KEY,
            String(rate)
          );
        } catch (
          error
        ) {
          console.warn(
            "保存最後匯率失敗：",
            error
          );
        }
      }
      // =========================================================
      // 新增歷史紀錄
      // =========================================================
      function addHistoryRecord(
        rate,
        previousRate
      ) {
        const history =
          loadHistory();
        const change =
          previousRate === null ?
          0 :
          rate - previousRate;
        const record = {
          time: getTaiwanTimeText(),
          rate: Number(
            rate.toFixed(3)
          ),
          change: Number(
            change.toFixed(3)
          )
        };
        // 最新在最前面
        history.unshift(
          record
        );
        // 最多 50 筆
        history.splice(
          CONFIG.MAX_HISTORY
        );
        saveHistory(
          history
        );
        renderHistory(
          history
        );
      }
      // =========================================================
      // 渲染歷史紀錄
      // =========================================================
      function renderHistory(
        history
      ) {
        historyBody.innerHTML =
          "";
        historyCount.textContent =
          `${history.length} 筆`;
        if (
          history.length === 0
        ) {
          emptyHistory.style.display =
            "block";
          return;
        }
        emptyHistory.style.display =
          "none";
        for (
          const record of history
        ) {
          const row =
            document.createElement(
              "tr"
            );
          // 時間
          const timeCell =
            document.createElement(
              "td"
            );
          timeCell.textContent =
            record.time;
          // 匯率
          const rateCell =
            document.createElement(
              "td"
            );
          rateCell.textContent =
            Number(
              record.rate
            ).toFixed(3);
          // 變動
          const changeCell =
            document.createElement(
              "td"
            );
          if (
            record.change > 0
          ) {
            changeCell.textContent =
              `▲ +${Number(
                    record.change
                ).toFixed(3)}`;
            changeCell.className =
              "history-up";
          } else if (
            record.change < 0
          ) {
            changeCell.textContent =
              `▼ ${Number(
                    record.change
                ).toFixed(3)}`;
            changeCell.className =
              "history-down";
          } else {
            changeCell.textContent =
              "—";
            changeCell.className =
              "history-same";
          }
          row.appendChild(
            timeCell
          );
          row.appendChild(
            rateCell
          );
          row.appendChild(
            changeCell
          );
          historyBody.appendChild(
            row
          );
        }
      }
      // =========================================================
      // 顯示錯誤面板
      // =========================================================
      function showErrorPanel(
        message,
        details
      ) {
        errorMessage.textContent =
          message;
        errorDetails.textContent =
          details;
        errorOverlay.classList.add(
          "show"
        );
      }
      // =========================================================
      // 關閉錯誤面板
      // =========================================================
      function hideErrorPanel() {
        errorOverlay.classList.remove(
          "show"
        );
      }
      // =========================================================
      // 解析 BOT HTML
      // =========================================================
      function parseUsdSellRate(
        html
      ) {
        if (
          !html ||
          html.trim().length === 0
        ) {
          throw new Error(
            "Proxy 回傳空白內容"
          );
        }
        const parser =
          new DOMParser();
        const doc =
          parser.parseFromString(
            html,
            "text/html"
          );
        const rows =
          doc.querySelectorAll(
            "tr"
          );
        let usdRow =
          null;
        // -----------------------------------------------------
        // 找到美金 USD
        // -----------------------------------------------------
        for (
          const row of rows
        ) {
          const text =
            row.textContent
            .replace(
              /\s+/g,
              " "
            )
            .trim();
          if (
            text.includes(
              "美金"
            ) &&
            text.includes(
              "(USD)"
            )
          ) {
            usdRow =
              row;
            break;
          }
        }
        if (
          !usdRow
        ) {
          throw new Error(
            "找不到美金 (USD) 資料"
          );
        }
        // -----------------------------------------------------
        // 找本行即期賣出
        // -----------------------------------------------------
        const sellElement =
          usdRow.querySelector(
            'td[data-table="本行即期賣出"]'
          );
        if (
          !sellElement
        ) {
          throw new Error(
            "找不到「本行即期賣出」欄位"
          );
        }
        const rateText =
          sellElement.textContent
          .trim()
          .replace(
            /,/g,
            ""
          );
        const rate =
          Number(
            rateText
          );
        if (
          !Number.isFinite(
            rate
          )
        ) {
          throw new Error(
            "取得的匯率不是有效數字：" +
            rateText
          );
        }
        return rate;
      }
      // =========================================================
      // 顯示匯率
      // =========================================================
      function updateRate(
        rate
      ) {
        const oldRate =
          previousRate;
        const formattedRate =
          rate.toFixed(3);
        rateElement.textContent =
          formattedRate;
        // -----------------------------------------------------
        // 匯率有變動
        // -----------------------------------------------------
        if (
          oldRate !== null &&
          rate !== oldRate
        ) {
          if (
            rate > oldRate
          ) {
            rateElement.classList.add(
              "up"
            );
            rateElement.classList.remove(
              "down"
            );
          } else {
            rateElement.classList.add(
              "down"
            );
            rateElement.classList.remove(
              "up"
            );
          }
          setTimeout(
            () => {
              rateElement.classList.remove(
                "up"
              );
              rateElement.classList.remove(
                "down"
              );
            },
            500
          );
          // -------------------------------------------------
          // 只有匯率真的變動才寫歷史
          // -------------------------------------------------
          addHistoryRecord(
            rate,
            oldRate
          );
        }
        // -----------------------------------------------------
        // 第一次成功取得
        //
        // 也建立第一筆基準紀錄
        // -----------------------------------------------------
        if (
          oldRate === null
        ) {
          addHistoryRecord(
            rate,
            null
          );
        }
        previousRate =
          rate;
        saveLastSuccessfulRate(
          rate
        );
      }
      // =========================================================
      // 取得匯率
      // =========================================================
      async function fetchRate() {
        if (
          isFetching
        ) {
          return;
        }
        isFetching =
          true;
        try {
          statusElement.textContent =
            "更新中...";
          statusElement.classList.remove(
            "error"
          );
          const response =
            await fetch(
              getApiUrl(), {
                method: "GET",
                cache: "no-store",
                headers: {
                  "Accept": "text/html"
                }
              }
            );
          if (
            !response.ok
          ) {
            throw new Error(
              `Proxy HTTP ${response.status}`
            );
          }
          const html =
            await response.text();
          const rate =
            parseUsdSellRate(
              html
            );
          // -------------------------------------------------
          // 成功
          // -------------------------------------------------
          updateRate(
            rate
          );
          statusElement.textContent =
            "最後更新：" +
            getTaiwanTimeText();
          statusElement.classList.remove(
            "error"
          );
          // -------------------------------------------------
          // 成功後自動關閉警示
          // -------------------------------------------------
          hideErrorPanel();
        } catch (
          error
        ) {
          console.error(
            "取得匯率失敗：",
            error
          );
          const lastRate =
            previousRate !== null ?
            previousRate :
            loadLastSuccessfulRate();
          // -------------------------------------------------
          // 保留最後成功匯率
          // -------------------------------------------------
          if (
            lastRate !== null &&
            rateElement.textContent === "--"
          ) {
            rateElement.textContent =
              lastRate.toFixed(3);
          }
          statusElement.textContent =
            "匯率服務暫時無法使用";
          statusElement.classList.add(
            "error"
          );
          // -------------------------------------------------
          // 顯示警示面板
          // -------------------------------------------------
          showErrorPanel(
            "目前無法取得最新匯率。",
            "錯誤：" +
            error.message +
            "\n\n" +
            "最後成功匯率：" +
            (
              lastRate !== null ?
              lastRate.toFixed(3) :
              "--"
            ) +
            "\n" +
            "錯誤時間：" +
            getTaiwanTimeText()
          );
        } finally {
          isFetching =
            false;
        }
      }
      // =========================================================
      // 停止自動更新
      // =========================================================
      function stopAutoRefresh() {
        if (
          refreshTimer !== null
        ) {
          clearInterval(
            refreshTimer
          );
          refreshTimer =
            null;
        }
      }
      // =========================================================
      // 啟動自動更新
      // =========================================================
      function startAutoRefresh() {
        if (
          refreshTimer !== null
        ) {
          return;
        }
        refreshTimer =
          setInterval(
            () => {
              if (
                !isTradingTime()
              ) {
                stopAutoRefresh();
                return;
              }
              fetchRate();
            },
            CONFIG.REFRESH_INTERVAL
          );
      }
      // =========================================================
      // 更新排程
      // =========================================================
      function updateSchedule() {
        const trading =
          isTradingTime();
        refreshElement.textContent =
          getScheduleText();
        if (
          trading
        ) {
          startAutoRefresh();
        } else {
          stopAutoRefresh();
        }
      }
      // =========================================================
      // 每 10 秒檢查交易時間
      // =========================================================
      function checkSchedule() {
        const trading =
          isTradingTime();
        refreshElement.textContent =
          getScheduleText();
        // -----------------------------------------------------
        // 第一次
        // -----------------------------------------------------
        if (
          previousTradingState === null
        ) {
          previousTradingState =
            trading;
          return;
        }
        // -----------------------------------------------------
        // 非交易 → 交易
        //
        // 例如 08:59 → 09:00
        // -----------------------------------------------------
        if (
          !previousTradingState &&
          trading
        ) {
          fetchRate();
          startAutoRefresh();
        }
        // -----------------------------------------------------
        // 交易 → 非交易
        //
        // 例如 16:59 → 17:00
        // -----------------------------------------------------
        if (
          previousTradingState &&
          !trading
        ) {
          stopAutoRefresh();
        }
        previousTradingState =
          trading;
      }
      // =========================================================
      // 重新嘗試按鈕
      // =========================================================
      retryButton.addEventListener(
        "click",
        () => {
          fetchRate();
        }
      );
      // =========================================================
      // ESC 關閉錯誤面板
      //
      // 注意：
      // 關閉後不代表錯誤消失。
      // 下一次抓取失敗仍會再次出現。
      // =========================================================
      document.addEventListener(
        "keydown",
        event => {
          if (
            event.key ===
            "Escape"
          ) {
            hideErrorPanel();
          }
        }
      );
      // =========================================================
      // 載入歷史
      // =========================================================
      renderHistory(
        loadHistory()
      );
      // =========================================================
      // 還原最後成功匯率
      //
      // 如果網頁剛開啟時 API 暫時失敗，
      // 先顯示上一次成功的數字。
      // =========================================================
      const savedRate =
        loadLastSuccessfulRate();
      if (
        savedRate !== null
      ) {
        rateElement.textContent =
          savedRate.toFixed(3);
        previousRate =
          savedRate;
      }
      // =========================================================
      // 第一次開啟
      //
      // 不論交易時間：
      // 立即抓一次。
      // =========================================================
      fetchRate();
      // =========================================================
      // 初始化交易狀態
      // =========================================================
      previousTradingState =
        isTradingTime();
      updateSchedule();
      // =========================================================
      // 每 10 秒檢查交易狀態
      // =========================================================
      scheduleTimer =
        setInterval(
          checkSchedule,
          CONFIG.SCHEDULE_INTERVAL
        );
      // =========================================================
      // 頁面從背景回到前景
      //
      // 手機瀏覽器可能暫停 timer。
      // 回來時立即重新檢查。
      // =========================================================
      document.addEventListener(
        "visibilitychange",
        () => {
          if (
            document.visibilityState ===
            "visible"
          ) {
            updateSchedule();
            if (
              isTradingTime()
            ) {
              fetchRate();
            }
          }
        }
      );
    </script>
  </body>
</html>
